name: proptest

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  proptest:
    # Pull requests opt in with the "proptest" label.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'proptest')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install
      run:
        uv sync --locked --group dev
    - name: Restore the ledger from the latest artifact
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        artifact=$(gh api \
          "repos/${{ github.repository }}/actions/artifacts?name=proptest-ledger" \
          --jq '[.artifacts[] | select(.expired | not)][0].id')
        if [ -n "$artifact" ]; then
          gh api \
            "repos/${{ github.repository }}/actions/artifacts/$artifact/zip" \
            > ledger.zip
          mkdir -p .hypothesis
          unzip -o ledger.zip -d .hypothesis
          rm ledger.zip
        fi
    - name: Run property tests
      run:
        uv run pytest proptest/ -vrxX
    - name: Upload the ledger
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proptest-ledger
        path: .hypothesis/proptest-ledger.json
        if-no-files-found: ignore
